[project]
name = "the-ark-api"
version = "0.1.0"
description = "Deterministic API for the ark Kantipur River MVP"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
